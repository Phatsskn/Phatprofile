<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Emerge Paid Media Dashboard</title><script src="https://cdn.jsdelivr.net/npm/chart.js"></script><style>:root{--bg:#f4f6fa;--card:#fff;--text:#17202a;--muted:#667085;--line:#e5e7eb}*{box-sizing:border-box}body{margin:0;font-family:Inter,Arial,sans-serif;background:var(--bg);color:var(--text)}.wrap{max-width:1440px;margin:auto;padding:28px}.head{display:flex;justify-content:space-between;align-items:end}.period{font-weight:800;background:#eef2ff;color:#3730a3;padding:9px 13px;border-radius:999px}.tabs{display:flex;gap:8px;margin:22px 0;flex-wrap:wrap}.tabs button{padding:10px 16px;border:1px solid var(--line);background:#fff;border-radius:10px;cursor:pointer;font-weight:700}.tabs .active{background:#17202a;color:#fff}.notice,.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px}.notice{margin-bottom:14px;color:#667085;font-size:13px}.kpis{display:grid;grid-template-columns:repeat(6,1fr);gap:12px}.label{font-size:12px;color:#667085}.value{font-size:25px;font-weight:800;margin-top:6px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:14px}.wide{grid-column:1/-1}.chart{height:310px}table{width:100%;border-collapse:collapse;font-size:13px}th,td{padding:10px;border-bottom:1px solid var(--line);text-align:right}th:first-child,td:first-child{text-align:left}th{background:#fafafa;color:#667085}.tablewrap{overflow:auto;max-height:560px}.angleCards{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.angleCard{border:1px solid var(--line);border-radius:14px;padding:16px}.creativeImg{width:100%;aspect-ratio:1/1;object-fit:cover;border-radius:10px}.metricrow{display:flex;justify-content:space-between;padding:5px 0}.statusgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin:12px 0}.statusbox{border:1px solid var(--line);border-radius:12px;padding:13px}.statusbox .n{font-size:22px;font-weight:800}input,select,textarea{border:1px solid #d0d5dd;border-radius:8px;padding:7px 9px;min-width:120px}textarea{min-width:190px}.toolbar{display:flex;justify-content:space-between;gap:10px;align-items:center}@media(max-width:900px){.kpis{grid-template-columns:repeat(2,1fr)}.grid,.angleCards{grid-template-columns:1fr}.wide{grid-column:auto}}</style></head><body><div class="wrap"><div class="head"><div><h1>Paid Media Performance Dashboard</h1><div>Google Ads + Meta Ads · Emerge Performance</div></div><div class="period">1–23 Aug 2026</div></div><div class="notice">Google Ads and Meta Ads use the same reporting period. Meta excludes TPC L2 Bridge / July campaign results. Google spend is SGD; Meta spend is USD. Meta lead total is 44.</div><div class="tabs"><button data-tab="overview" class="active">Overview</button><button data-tab="google">Google Ads</button><button data-tab="meta">Meta Ads + Lead Quality</button></div><div id="view"></div></div><script>const G={spend:397.63,impressions:1246,clicks:73,conversions:3,ctr:5.86,cpa:132.54,locations:[{name:'Vietnam',cost:28.99,clicks:7,impressions:143,conversions:1,cpa:28.99},{name:'Thailand',cost:74.96,clicks:14,impressions:300,conversions:1,cpa:74.96},{name:'Malaysia',cost:293.68,clicks:52,impressions:803,conversions:1,cpa:293.68}]};const META={spend:625.5,impressions:21548,reach:12039,leads:44,cpl:14.2159,markets:[{name:'Australia',spend:324.75,leads:15,cpl:21.65},{name:'Malaysia',spend:134.17,leads:20,cpl:6.7085},{name:'Singapore',spend:166.58,leads:9,cpl:18.5089}],angles:[{name:'Benefit',spend:191,leads:16,cpl:11.9375},{name:'Promotion',spend:127.27,leads:6,cpl:21.2117},{name:'Trend',spend:307.23,leads:22,cpl:13.965}]};const DEFAULTS={10:{status:'Interested in another program',angle:'Trend',market:'Australia',note:'training experience; awaiting details. Follow up needed.'},11:{status:'Interested in another program',angle:'Trend',market:'Australia',note:'recommending a programme. Follow up needed.'},29:{status:'Interested',angle:'Benefit',market:'Malaysia',note:'Q1 2027 cohort schedule shared. Follow up needed.'},34:{status:'Interested',angle:'Promotion',market:'Singapore',note:'promotion, and reviews shared. Follow up needed.'},38:{status:'Interested in another program',angle:'Benefit',market:'Singapore',note:'promotion, and reviews shared. Follow up needed.'},43:{status:'Interested in another program',angle:'Trend',market:'Australia',note:'Coaching Village community shared. Follow up needed.'}};const S=['New','In discussion','Interested','No response','Interested in another program','Converted','Not qualified'],A=['','Benefit','Trend','Promotion'],M=['','Singapore','Malaysia','Australia'];const money=(n,c)=>c+' '+Number(n).toFixed(2),fmt=n=>Math.round(n).toLocaleString();let leads=[];function load(){try{leads=JSON.parse(localStorage.getItem('emergeLeadTrackerV4')||'null')}catch(e){}if(!Array.isArray(leads))leads=[];leads=Array.from({length:44},(_,i)=>{const old=leads[i]||{};return Object.assign({id:i+1,name:'Name '+(i+1),status:'New',angle:'',market:'',note:''},DEFAULTS[i+1]||{},old,{id:i+1,name:'Name '+(i+1)})});localStorage.setItem('emergeLeadTrackerV4',JSON.stringify(leads))}function kpis(a){return '<div class="kpis">'+a.map(x=>`<div class="card"><div class="label">${x[0]}</div><div class="value">${x[1]}</div></div>`).join('')+'</div>'}function summary(){const c={};S.forEach(x=>c[x]=0);leads.forEach(r=>c[r.status]=(c[r.status]||0)+1);return '<div class="statusgrid">'+['In discussion','Interested','No response','Interested in another program','Converted'].map(x=>`<div class="statusbox"><div class="n">${c[x]}</div><div>${x}</div></div>`).join('')+'</div>'}function overview(){view.innerHTML=kpis([['Google spend',money(G.spend,'SGD')],['Google conversions',G.conversions],['Google CPA',money(G.cpa,'SGD')],['Meta spend',money(META.spend,'USD')],['Meta leads',META.leads],['Meta CPL',money(META.cpl,'USD')]])+`<div class="grid"><div class="card"><h2>Google Ads</h2><p>${G.clicks} clicks · ${fmt(G.impressions)} impressions · ${G.conversions} conversions</p></div><div class="card"><h2>Meta Ads</h2><p>${META.leads} leads · ${fmt(META.impressions)} impressions</p></div></div>`}function google(){view.innerHTML=kpis([['Spend',money(G.spend,'SGD')],['Impressions',fmt(G.impressions)],['Clicks',G.clicks],['CTR',G.ctr+'%'],['Conversions',G.conversions],['CPA',money(G.cpa,'SGD')]])+`<div class="card" style="margin-top:14px"><h2>Spend by market</h2><table><tr><th>Market</th><th>Spend</th><th>Clicks</th><th>Conversions</th><th>CPA</th></tr>${G.locations.map(x=>`<tr><td>${x.name}</td><td>${money(x.cost,'SGD')}</td><td>${x.clicks}</td><td>${x.conversions}</td><td>${money(x.cpa,'SGD')}</td></tr>`).join('')}</table></div>`}function meta(){load();view.innerHTML=kpis([['Spend',money(META.spend,'USD')],['Impressions',fmt(META.impressions)],['Reach',fmt(META.reach)],['Leads',META.leads],['Meta CPL',money(META.cpl,'USD')],['Tracked statuses',leads.filter(x=>x.status!=='New').length]])+`<div class="grid"><div class="card wide"><h2>Creative A/B Test</h2><div class="angleCards">${META.angles.map(x=>`<div class="angleCard"><h3>${x.name}</h3><div class="metricrow"><span>Spend</span><b>${money(x.spend,'USD')}</b></div><div class="metricrow"><span>Leads</span><b>${x.leads}</b></div><div class="metricrow"><span>CPL</span><b>${money(x.cpl,'USD')}</b></div></div>`).join('')}</div></div><div class="card wide"><h2>Lead Status Tracker</h2><p>44 Meta leads · names anonymized for team reporting</p><div id="sum">${summary()}</div><div class="tablewrap"><table><thead><tr><th>#</th><th>Lead</th><th>Status</th><th>Creative angle</th><th>Market</th><th>Notes</th></tr></thead><tbody>${leads.map((r,i)=>`<tr data-i="${i}"><td>${i+1}</td><td><input value="Name ${i+1}" readonly></td><td><select data-f="status">${S.map(x=>`<option ${x===r.status?'selected':''}>${x}</option>`).join('')}</select></td><td><select data-f="angle">${A.map(x=>`<option value="${x}" ${x===r.angle?'selected':''}>${x||'—'}</option>`).join('')}</select></td><td><select data-f="market">${M.map(x=>`<option value="${x}" ${x===r.market?'selected':''}>${x||'—'}</option>`).join('')}</select></td><td><textarea data-f="note">${r.note||''}</textarea></td></tr>`).join('')}</tbody></table></div></div><div class="card"><h2>Spend by market</h2>${META.markets.map(x=>`<div class="metricrow"><span>${x.name}</span><b>${money(x.spend,'USD')}</b></div>`).join('')}</div><div class="card"><h2>CPL by market</h2>${META.markets.map(x=>`<div class="metricrow"><span>${x.name}</span><b>${money(x.cpl,'USD')}</b></div>`).join('')}</div></div>`;document.querySelectorAll('select,textarea').forEach(el=>el.addEventListener('change',e=>{const tr=e.target.closest('tr');if(!tr)return;leads[+tr.dataset.i][e.target.dataset.f]=e.target.value;localStorage.setItem('emergeLeadTrackerV4',JSON.stringify(leads));document.getElementById('sum').innerHTML=summary()}))}const view=document.getElementById('view');document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tabs button').forEach(x=>x.classList.remove('active'));b.classList.add('active');({overview,google,meta})[b.dataset.tab]()});overview();</script></body></html>
