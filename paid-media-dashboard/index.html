<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Emerge Paid Media Dashboard</title><script src="https://cdn.jsdelivr.net/npm/chart.js"></script><style>:root{--bg:#f4f6fa;--card:#fff;--text:#17202a;--muted:#667085;--line:#e5e7eb;--blue:#0b3a6f;--green:#067647}*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:var(--bg);color:var(--text)}.wrap{max-width:1400px;margin:auto;padding:28px}.head{display:flex;justify-content:space-between;gap:20px;align-items:end}.head h1{margin:0;font-size:30px}.sub{color:var(--muted);margin-top:6px}.period{background:#eef2ff;color:#3730a3;padding:10px 14px;border-radius:999px;font-weight:800}.tabs{display:flex;gap:8px;margin:22px 0;flex-wrap:wrap}.tabs button{border:1px solid var(--line);background:white;border-radius:10px;padding:10px 16px;font-weight:700;cursor:pointer}.tabs .active{background:#17202a;color:white}.notice{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 15px;color:var(--muted);font-size:13px;margin-bottom:14px}.kpis{display:grid;grid-template-columns:repeat(6,1fr);gap:12px}.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px}.label{font-size:12px;color:var(--muted)}.value{font-size:24px;font-weight:800;margin-top:6px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:14px}.wide{grid-column:1/-1}h2{font-size:17px;margin:0 0 5px}.desc{font-size:12px;color:var(--muted);margin-bottom:12px}.chart{height:300px}.angles{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.angle{border:1px solid var(--line);border-radius:14px;padding:16px}.angle.best{outline:2px solid #86efac}.creativeMock{aspect-ratio:1/1;border-radius:10px;background:linear-gradient(145deg,#082f63,#0f559c);color:white;display:flex;align-items:center;justify-content:center;text-align:center;padding:20px;font-size:22px;font-weight:800;margin-bottom:12px}.metric{display:flex;justify-content:space-between;padding:5px 0;font-size:13px}.winner{font-size:11px;background:#ecfdf3;color:var(--green);padding:4px 7px;border-radius:999px;margin-left:6px}.statusgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin:12px 0}.statusbox{border:1px solid var(--line);border-radius:12px;padding:12px}.statusbox b{font-size:22px;display:block}.statusbox span{font-size:12px;color:var(--muted)}.tablewrap{overflow:auto;max-height:560px;border:1px solid var(--line);border-radius:12px}table{width:100%;border-collapse:collapse;font-size:13px}th,td{padding:10px;border-bottom:1px solid var(--line);text-align:right}th:first-child,td:first-child{text-align:left}th{color:var(--muted);background:#fafafa;position:sticky;top:0}input,select,textarea{border:1px solid #d0d5dd;border-radius:8px;padding:7px;font:inherit;background:white}textarea{min-width:180px;min-height:36px}.toolbar{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center}.btn{border:1px solid var(--line);background:#17202a;color:white;border-radius:9px;padding:8px 11px;font-weight:700;cursor:pointer}@media(max-width:900px){.kpis{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:1fr}.wide{grid-column:auto}.angles{grid-template-columns:1fr}.statusgrid{grid-template-columns:repeat(2,1fr)}.head{align-items:start;flex-direction:column}}</style></head><body><div class="wrap"><div class="head"><div><h1>Paid Media Performance Dashboard</h1><div class="sub">Google Ads + Meta Ads · Emerge Performance</div></div><div class="period">1–23 Aug 2026</div></div><div class="notice">Both channels use the same reporting period. Meta excludes TPC L2 Bridge / July campaign results. Google spend is SGD and Meta spend is USD. Lead-status edits are saved in each browser.</div><div class="tabs"><button class="active" data-tab="overview">Overview</button><button data-tab="google">Google Ads</button><button data-tab="meta">Meta Ads + Lead Quality</button></div><div id="view"></div></div><script>const G={spend:397.63,impressions:1246,clicks:73,conversions:3,ctr:5.86,cpa:132.54,locations:[{name:'Vietnam',spend:28.99,clicks:7,impressions:143,conversions:1,cpa:28.99},{name:'Thailand',spend:74.96,clicks:14,impressions:300,conversions:1,cpa:74.96},{name:'Malaysia',spend:293.68,clicks:52,impressions:803,conversions:1,cpa:293.68}],keywords:[{keyword:'[icf team coaching certification]',cpa:57.73,cvr:10},{keyword:'executive team coaching',cpa:59.31,cvr:14.29},{keyword:'team coaching program',cpa:81.91,cvr:4.76}]};const M={spend:625.50,impressions:21548,reach:16683,leads:44,cpl:14.22,markets:[{name:'Australia',spend:324.75,leads:15,cpl:21.65},{name:'Malaysia',spend:134.17,leads:20,cpl:6.71},{name:'Singapore',spend:166.58,leads:9,cpl:18.51}],angles:[{name:'Trend',spend:307.23,leads:22,cpl:13.97},{name:'Benefit',spend:191.00,leads:16,cpl:11.94},{name:'Promotion',spend:127.27,leads:6,cpl:21.21}],daily:[['4 Aug',2],['5 Aug',2],['6 Aug',3],['7 Aug',1],['8 Aug',2],['9 Aug',4],['10 Aug',2],['11 Aug',0],['12 Aug',2],['13 Aug',1],['14 Aug',2],['15 Aug',5],['16 Aug',3],['17 Aug',2],['18 Aug',2],['19 Aug',0],['20 Aug',3],['21 Aug',1],['22 Aug',1],['23 Aug',6]]};const LEADS=['Shweta Yashpal Saini','Ben Cross','Mario Raymond Levantard','Anna Hisco','Jeremy Castelino','Matt Miller','Mohamed Saif','Aaron Gambrill','Brett','Hema Rao','O Hari Tanze','Tiffany Folbigg','Murali Subramanian','Amarjit Kaur a/p Gurmith Singh','Eartha Chew','Saravanan Sunny Murthi','Stephanie O','Chaziz Samuel Solomon','Tan Yean Hong','Ahmootha Ramachandra','Dippy Ka','Ravy Perumal','Ahmad Bin Mahad','Zue A Latiff','Shirley','Zaama B','Iskandar','Maxwell Sim Yik See','Kok Michael','Ranjinath','Namrita','James N','Tiong Koh','Wayne','Ellex','Bri','Doon','Sun Zhe','Unidentified lead 39','Unidentified lead 40','Unidentified lead 41','Unidentified lead 42','Unidentified lead 43','Unidentified lead 44'];const statuses=['New','In discussion','Interested','No response','Interested in another program','Converted','Not qualified'];let charts=[];let rows=[];const view=document.getElementById('view');const money=(n,c)=>c+' '+Number(n).toFixed(2),fmt=n=>Math.round(n).toLocaleString();function clear(){charts.forEach(c=>c.destroy());charts=[]}function kpis(a){return '<div class="kpis">'+a.map(x=>'<div class="card"><div class="label">'+x[0]+'</div><div class="value">'+x[1]+'</div></div>').join('')+'</div>'}function bar(id,labels,vals){charts.push(new Chart(document.getElementById(id),{type:'bar',data:{labels,datasets:[{data:vals}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{y:{beginAtZero:true},x:{grid:{display:false}}}}}))}function line(id,labels,vals){charts.push(new Chart(document.getElementById(id),{type:'line',data:{labels,datasets:[{data:vals,tension:.25}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{y:{beginAtZero:true},x:{grid:{display:false}}}}}))}function overview(){clear();view.innerHTML=kpis([['Google spend',money(G.spend,'SGD')],['Google conversions',G.conversions],['Google CPA',money(G.cpa,'SGD')],['Meta spend',money(M.spend,'USD')],['Meta leads',M.leads],['Meta CPL',money(M.cpl,'USD')]])+'<div class="grid"><div class="card"><h2>Google spend by market</h2><div class="chart"><canvas id="g1"></canvas></div></div><div class="card"><h2>Meta spend by market</h2><div class="chart"><canvas id="m1"></canvas></div></div></div>';bar('g1',G.locations.map(x=>x.name),G.locations.map(x=>x.spend));bar('m1',M.markets.map(x=>x.name),M.markets.map(x=>x.spend))}function google(){clear();view.innerHTML=kpis([['Spend',money(G.spend,'SGD')],['Impressions',fmt(G.impressions)],['Clicks',G.clicks],['CTR',G.ctr.toFixed(2)+'%'],['Conversions',G.conversions],['CPA',money(G.cpa,'SGD')]])+'<div class="grid"><div class="card"><h2>Spend by market</h2><div class="chart"><canvas id="g2"></canvas></div></div><div class="card"><h2>CPA by market</h2><div class="chart"><canvas id="g3"></canvas></div></div><div class="card wide"><h2>Converting keywords</h2><table><thead><tr><th>Keyword</th><th>CPA</th><th>Conversion rate</th></tr></thead><tbody>'+G.keywords.map(x=>'<tr><td>'+x.keyword+'</td><td>'+money(x.cpa,'SGD')+'</td><td>'+x.cvr.toFixed(2)+'%</td></tr>').join('')+'</tbody></table></div></div>';bar('g2',G.locations.map(x=>x.name),G.locations.map(x=>x.spend));bar('g3',G.locations.map(x=>x.name),G.locations.map(x=>x.cpa))}function loadRows(){try{rows=JSON.parse(localStorage.getItem('emergePublicLeadTracker')||'null')}catch(e){}if(!Array.isArray(rows)||!rows.length)rows=LEADS.map((n,i)=>({name:n,status:'New',angle:'',market:'',note:''}))}function save(){try{localStorage.setItem('emergePublicLeadTracker',JSON.stringify(rows))}catch(e){}}function summary(){const c={};statuses.forEach(s=>c[s]=0);rows.forEach(r=>c[r.status]=(c[r.status]||0)+1);return ['In discussion','Interested','No response','Interested in another program','Converted'].map(s=>'<div class="statusbox"><b>'+c[s]+'</b><span>'+s+'</span></div>').join('')}function meta(){clear();loadRows();const best='Benefit';view.innerHTML=kpis([['Spend',money(M.spend,'USD')],['Impressions',fmt(M.impressions)],['Reach',fmt(M.reach)],['Leads',M.leads],['CPL',money(M.cpl,'USD')],['Tracked statuses',rows.filter(x=>x.status!=='New').length]])+'<div class="grid"><div class="card wide"><h2>Creative A/B test</h2><div class="desc">Trend vs Benefit vs Promotion. Benefit currently has the lowest CPL.</div><div class="angles">'+M.angles.map(x=>'<div class="angle '+(x.name===best?'best':'')+'"><div class="creativeMock">'+x.name+' Creative</div><h2>'+x.name+(x.name===best?'<span class="winner">Best CPL</span>':'')+'</h2><div class="metric"><span>Spend</span><b>'+money(x.spend,'USD')+'</b></div><div class="metric"><span>Leads</span><b>'+x.leads+'</b></div><div class="metric"><span>CPL</span><b>'+money(x.cpl,'USD')+'</b></div></div>').join('')+'</div></div><div class="card wide"><div class="toolbar"><div><h2>Lead status tracker</h2><div class="desc">Update lead quality and follow-up status. Changes are stored in this browser.</div></div><button class="btn" id="exportBtn">Export CSV</button></div><div class="statusgrid" id="sum">'+summary()+'</div><div class="tablewrap"><table><thead><tr><th>#</th><th>Lead</th><th>Status</th><th>Creative angle</th><th>Market</th><th>Notes</th></tr></thead><tbody id="leadBody">'+rows.map((r,i)=>'<tr data-i="'+i+'"><td>'+(i+1)+'</td><td><input data-f="name" value="'+r.name.replaceAll('"','&quot;')+'"></td><td><select data-f="status">'+statuses.map(s=>'<option '+(s===r.status?'selected':'')+'>'+s+'</option>').join('')+'</select></td><td><select data-f="angle"><option></option>'+['Benefit','Trend','Promotion'].map(s=>'<option '+(s===r.angle?'selected':'')+'>'+s+'</option>').join('')+'</select></td><td><select data-f="market"><option></option>'+['Singapore','Malaysia','Australia'].map(s=>'<option '+(s===r.market?'selected':'')+'>'+s+'</option>').join('')+'</select></td><td><textarea data-f="note">'+(r.note||'')+'</textarea></td></tr>').join('')+'</tbody></table></div></div><div class="card wide"><h2>Daily Meta leads</h2><div class="chart"><canvas id="md"></canvas></div></div><div class="card"><h2>Spend by market</h2><div class="chart"><canvas id="m2"></canvas></div></div><div class="card"><h2>CPL by market</h2><div class="chart"><canvas id="m3"></canvas></div></div></div>';document.querySelectorAll('#leadBody input,#leadBody select,#leadBody textarea').forEach(el=>el.addEventListener('change',e=>{const i=Number(e.target.closest('tr').dataset.i);rows[i][e.target.dataset.f]=e.target.value;save();document.getElementById('sum').innerHTML=summary()}));document.getElementById('exportBtn').addEventListener('click',()=>{const a=document.createElement('a');const csv=[['Lead','Status','Creative angle','Market','Notes'],...rows.map(r=>[r.name,r.status,r.angle,r.market,r.note])].map(row=>row.map(v=>'"'+String(v||'').replaceAll('"','""')+'"').join(',')).join('\n');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download='Meta_Lead_Status_Tracker.csv';a.click()});line('md',M.daily.map(x=>x[0]),M.daily.map(x=>x[1]));bar('m2',M.markets.map(x=>x.name),M.markets.map(x=>x.spend));bar('m3',M.markets.map(x=>x.name),M.markets.map(x=>x.cpl))}document.querySelectorAll('.tabs button').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('.tabs button').forEach(x=>x.classList.remove('active'));b.classList.add('active');({overview,google,meta})[b.dataset.tab]()}));overview();</script></body></html>
