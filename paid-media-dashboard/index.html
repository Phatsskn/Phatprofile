<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Emerge Paid Media Dashboard</title><script src="https://cdn.jsdelivr.net/npm/chart.js"></script><style>:root{--bg:#f4f6fa;--card:#fff;--text:#17202a;--muted:#667085;--line:#e5e7eb}*{box-sizing:border-box}body{margin:0;font-family:Inter,Arial,sans-serif;background:var(--bg);color:var(--text)}.wrap{max-width:1440px;margin:auto;padding:28px}.head{display:flex;justify-content:space-between;align-items:end}.period{font-weight:800;background:#eef2ff;color:#3730a3;padding:9px 13px;border-radius:999px}.tabs{display:flex;gap:8px;margin:22px 0}.tabs button{padding:10px 16px;border:1px solid var(--line);background:#fff;border-radius:10px;cursor:pointer;font-weight:700}.tabs .active{background:#17202a;color:#fff}.notice,.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px}.notice{margin-bottom:14px;color:#667085;font-size:13px}.kpis{display:grid;grid-template-columns:repeat(6,1fr);gap:12px}.label{font-size:12px;color:#667085}.value{font-size:25px;font-weight:800;margin-top:6px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:14px}.wide{grid-column:1/-1}.chart{height:310px}table{width:100%;border-collapse:collapse;font-size:13px}th,td{padding:10px;border-bottom:1px solid var(--line);text-align:right}th:first-child,td:first-child{text-align:left}.angleCards{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.angleCard{border:1px solid var(--line);border-radius:14px;padding:16px}.creativeImg{width:100%;aspect-ratio:1/1;object-fit:cover;border-radius:10px}.metricrow{display:flex;justify-content:space-between;padding:5px 0}.tablewrap{overflow:auto;max-height:560px}.statusgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin:12px 0}.statusbox{border:1px solid var(--line);border-radius:12px;padding:13px}.statusbox .n{font-size:22px;font-weight:800}input,select,textarea{border:1px solid #d0d5dd;border-radius:8px;padding:7px 9px;min-width:120px}textarea{min-width:190px}.toolbar{display:flex;justify-content:space-between;gap:10px;align-items:center}.btn{border:1px solid var(--line);background:#fff;border-radius:9px;padding:8px 11px;cursor:pointer}.btn.primary{background:#17202a;color:#fff}@media(max-width:900px){.kpis{grid-template-columns:repeat(2,1fr)}.grid,.angleCards{grid-template-columns:1fr}.wide{grid-column:auto}}</style></head><body><div class="wrap"><div class="head"><div><h1>Paid Media Performance Dashboard</h1><div>Google Ads + Meta Ads · Emerge Performance</div></div><div class="period">1–23 Aug 2026</div></div><div class="notice">Both platforms use the same reporting period. Meta excludes TPC L2 Bridge / July campaign results. Google spend is SGD; Meta spend is USD. Lead status changes are saved locally in your browser.</div><div class="tabs"><button data-tab="overview" class="active">Overview</button><button data-tab="google">Google Ads</button><button data-tab="meta">Meta Ads + Lead Quality</button></div><div id="view"></div></div><script>const D={google:{spend:397.63,impressions:1246,clicks:73,conversions:3,ctr:5.8587,cpa:132.5433},meta:{spend:625.5,impressions:21548,reach:16683,leads:33,cpl:18.9545,markets:[{name:'Australia',spend:324.75,impressions:7183,reach:5845},{name:'Malaysia',spend:134.17,impressions:10693,reach:7992},{name:'Singapore',spend:166.58,impressions:3672,reach:2846}],angles:[{name:'Benefit',spend:191,impressions:7837},{name:'Promotion',spend:127.27,impressions:2946},{name:'Trend',spend:307.23,impressions:10765}]},leadCount:33};const N=['Shweta Yashpal Saini','Ben Cross','Mario Raymond Levantard','Anna Hisco','Jeremy Castelino','Matt Miller','Mohamed Saif','Aaron Gambrill','Brett','Hema Rao','O Hari Tanze','Tiffany Folbigg','Murali Subramanian','Amarjit Kaur a/p Gurmith Singh','Eartha Chew','Saravanan Sunny Murthi','Stephanie O','Chaziz Samuel Solomon','Tan Yean Hong','Ahmootha Ramachandra','Dippy Ka','Ravy Perumal','Ahmad Bin Mahad','Zue A Latiff','Shirley','Zaama B','Iskandar','Maxwell Sim Yik See','Kok Michael','Ranjinath','Namrita','James N','Tiong Koh'];const IMG={Trend:'trend.webp',Benefit:'benefit.webp',Promotion:'promotion.webp'};const fmt=n=>Math.round(n).toLocaleString(),money=(n,c)=>c+' '+Number(n).toFixed(2);let charts=[];function clear(){charts.forEach(c=>c.destroy());charts=[]}function kpis(a){return '<div class="kpis">'+a.map(x=>`<div class="card"><div class="label">${x[0]}</div><div class="value">${x[1]}</div></div>`).join('')+'</div>'}function bar(id,l,v){charts.push(new Chart(document.getElementById(id),{type:'bar',data:{labels:l,datasets:[{data:v}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{y:{beginAtZero:true}}}}))}function overview(){clear();view.innerHTML=kpis([['Google spend',money(D.google.spend,'SGD')],['Google conversions',3],['Google CPA',money(D.google.cpa,'SGD')],['Meta spend',money(D.meta.spend,'USD')],['Meta leads',33],['Meta CPL',money(D.meta.cpl,'USD')]])+`<div class="grid"><div class="card"><h2>Google Ads</h2><p>73 clicks · 1,246 impressions · 3 conversions</p></div><div class="card"><h2>Meta Ads</h2><p>33 leads · 21,548 impressions · 16,683 reach</p></div></div>`}function google(){clear();view.innerHTML=kpis([['Spend',money(D.google.spend,'SGD')],['Impressions',fmt(D.google.impressions)],['Clicks',fmt(D.google.clicks)],['CTR',D.google.ctr.toFixed(2)+'%'],['Conversions',3],['CPA',money(D.google.cpa,'SGD')]])+`<div class="grid"><div class="card wide"><h2>Google Ads Lead Results</h2><p>3 conversions recorded for 1–23 Aug 2026.</p></div></div>`}const S=['New','In discussion','Interested','No response','Interested in another program','Converted','Not qualified'],A=['','Benefit','Trend','Promotion'],M=['','Singapore','Malaysia','Australia'];let leads=[];function load(){try{leads=JSON.parse(localStorage.getItem('emergeLeadTrackerV2')||'null')}catch(e){}if(!Array.isArray(leads)){leads=N.map((name,i)=>({id:i+1,name,status:'New',angle:'',market:'',note:''}))}leads=leads.slice(0,33);while(leads.length<33)leads.push({id:leads.length+1,name:N[leads.length]||'Lead '+(leads.length+1),status:'New',angle:'',market:'',note:''})}function save(){localStorage.setItem('emergeLeadTrackerV2',JSON.stringify(leads))}function summary(){const c={};S.forEach(x=>c[x]=0);leads.forEach(r=>c[r.status]=(c[r.status]||0)+1);return '<div class="statusgrid">'+['In discussion','Interested','No response','Interested in another program','Converted'].map(x=>`<div class="statusbox"><div class="n">${c[x]}</div><div>${x}</div></div>`).join('')+'</div>'}function meta(){clear();load();view.innerHTML=kpis([['Spend',money(D.meta.spend,'USD')],['Impressions',fmt(D.meta.impressions)],['Reach',fmt(D.meta.reach)],['Leads','33'],['CPL',money(D.meta.cpl,'USD')],['Tracked statuses',leads.filter(x=>x.status!=='New').length]])+`<div class="grid"><div class="card wide"><h2>Creative A/B Test</h2><div class="angleCards">${D.meta.angles.map(x=>`<div class="angleCard"><img class="creativeImg" src="${IMG[x.name]}"><h3>${x.name}</h3><div class="metricrow"><span>Spend</span><b>${money(x.spend,'USD')}</b></div><div class="metricrow"><span>Impressions</span><b>${fmt(x.impressions)}</b></div></div>`).join('')}</div></div><div class="card wide"><div class="toolbar"><div><h2>Lead Status Tracker</h2><p>33 Meta leads</p></div></div><div id="sum">${summary()}</div><div class="tablewrap"><table><thead><tr><th>#</th><th>Lead</th><th>Status</th><th>Creative angle</th><th>Market</th><th>Notes</th></tr></thead><tbody>${leads.map((r,i)=>`<tr data-i="${i}"><td>${i+1}</td><td><input data-f="name" value="${r.name}"></td><td><select data-f="status">${S.map(x=>`<option ${x===r.status?'selected':''}>${x}</option>`).join('')}</select></td><td><select data-f="angle">${A.map(x=>`<option ${x===r.angle?'selected':''}>${x||'—'}</option>`).join('')}</select></td><td><select data-f="market">${M.map(x=>`<option ${x===r.market?'selected':''}>${x||'—'}</option>`).join('')}</select></td><td><textarea data-f="note">${r.note||''}</textarea></td></tr>`).join('')}</tbody></table></div></div><div class="card"><h2>Spend by market</h2><div class="chart"><canvas id="m1"></canvas></div></div><div class="card"><h2>Spend by angle</h2><div class="chart"><canvas id="m2"></canvas></div></div></div>`;document.querySelectorAll('input,select,textarea').forEach(el=>el.addEventListener('change',e=>{const tr=e.target.closest('tr');if(!tr)return;leads[+tr.dataset.i][e.target.dataset.f]=e.target.value;save();document.getElementById('sum').innerHTML=summary()}));bar('m1',D.meta.markets.map(x=>x.name),D.meta.markets.map(x=>x.spend));bar('m2',D.meta.angles.map(x=>x.name),D.meta.angles.map(x=>x.spend))}const view=document.getElementById('view');document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tabs button').forEach(x=>x.classList.remove('active'));b.classList.add('active');({overview,google,meta})[b.dataset.tab]()});overview();</script></body></html>
